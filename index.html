<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WonderGram — personal video greetings from storybook heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1630;--ink2:#18234A;--gold:#E2B864;--gold2:#F4D79A;--cream:#FBF4E6;--txt:#2A2420;--mut:#7A6F64;--red:#8E1F2C}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI",Inter,Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Hebrew","PingFang SC",sans-serif;color:var(--txt);background:var(--cream);line-height:1.55}
h1,h2,h3,.serif{font-family:"Lora",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:.3s;padding:14px 0}
nav.sc{background:rgba(14,22,48,.92);backdrop-filter:blur(10px);padding:9px 0;box-shadow:0 4px 20px rgba(0,0,0,.25)}
nav .wrap{display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;font-size:19px}
.logo svg{width:30px;height:30px}
nav .links{display:flex;gap:20px;margin-inline-start:auto}
nav .links a{color:#e9e2d4;text-decoration:none;font-size:14px;opacity:.85}
nav .links a:hover{opacity:1;color:var(--gold2)}
select.lang{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 10px;font-size:13px;width:auto}
select.lang option{color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2b1d07;border:0;border-radius:40px;padding:13px 26px;font-weight:650;font-size:15px;cursor:pointer;text-decoration:none;box-shadow:0 6px 20px rgba(226,184,100,.35);transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(226,184,100,.5)}
.btn.sm{padding:8px 16px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--ink)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right 30%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,16,38,.94) 0%,rgba(10,16,38,.82) 38%,rgba(10,16,38,.25) 68%,rgba(10,16,38,.05) 100%),linear-gradient(180deg,rgba(10,16,38,.6) 0%,transparent 22%,transparent 70%,rgba(10,16,38,.9) 100%)}
[dir=rtl] .hero:after{background:linear-gradient(270deg,rgba(10,16,38,.94) 0%,rgba(10,16,38,.82) 38%,rgba(10,16,38,.25) 68%,rgba(10,16,38,.05) 100%),linear-gradient(180deg,rgba(10,16,38,.6) 0%,transparent 22%,transparent 70%,rgba(10,16,38,.9) 100%)}
.wm{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(46px,7vw,92px);line-height:1;letter-spacing:-.01em;background:linear-gradient(180deg,#FFF1C9 0%,#F4D79A 40%,#C9953F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(226,184,100,.35));margin-bottom:18px;display:inline-flex;align-items:center;gap:12px}
.wm svg{width:.55em;height:.55em}
.hero h1,.hero p.lead{text-shadow:0 2px 14px rgba(0,0,0,.55)}
.hero .wrap{position:relative;z-index:2;padding-bottom:70px;width:100%}
.hero .copy{max-width:640px}
.eb{text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--gold2);margin-bottom:14px;font-weight:600}
.hero h1{font-size:clamp(34px,5.6vw,66px);line-height:1.06;max-width:820px;margin-bottom:18px}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);max-width:660px;opacity:.9;margin-bottom:26px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.badges span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:7px 14px;font-size:13.5px;backdrop-filter:blur(6px)}
.badges span:before{content:"✦ ";color:var(--gold2)}
/* sections */
section{padding:100px 0}
.sh{text-align:center;max-width:720px;margin:0 auto 50px}
.sh h2{font-size:clamp(30px,3.6vw,44px);margin-bottom:12px;color:var(--ink)}
.sh p{color:var(--mut);font-size:17px}
.dark{background:var(--ink);color:#efe8da}
.dark .sh h2{color:#fff}.dark .sh p{color:#b9b1a2}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{background:#fff;border-radius:22px;padding:30px 26px;box-shadow:0 10px 30px rgba(14,22,48,.06);position:relative}
.step b{display:flex;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--gold2);align-items:center;justify-content:center;font-family:Georgia,serif;font-size:19px;margin-bottom:16px}
.step h3{font-size:21px;margin-bottom:8px;color:var(--ink)}
.step p{color:var(--mut);font-size:15px}
/* heroes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--ink2);border-radius:22px;overflow:hidden;cursor:pointer;transition:.3s;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.4);border-color:rgba(226,184,100,.4)}
.card .im{aspect-ratio:4/3.4;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover .im img{transform:scale(1.05)}
.card .tx{padding:18px 20px 22px;display:flex;flex-direction:column;flex:1}
.card h3{color:#fff;font-size:21px;margin-bottom:6px}
.card p{color:#b9b1a2;font-size:14.5px;flex:1;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags i{font-style:normal;font-size:11.5px;background:rgba(226,184,100,.14);color:var(--gold2);border-radius:20px;padding:3px 9px}
.strip{display:flex;gap:16px;overflow-x:auto;padding:40px 22px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{height:300px;width:auto;border-radius:18px;scroll-snap-align:center;flex:none}
/* inside */
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.feat{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 34px rgba(14,22,48,.08)}
.feat .im{position:relative}
.feat .ph{position:absolute;left:59.9%;top:14.3%;width:20.2%;height:40.4%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff6e0,#f1dfb6)}
.feat .ph svg{width:55%;opacity:.55}
.feat .nm{position:absolute;left:56.5%;width:28.5%;top:64.8%;text-align:center;font-family:Georgia,serif;font-style:italic;color:#9a6a1c;font-size:clamp(11px,1.6vw,20px);font-weight:700}
.feat .tx{padding:26px 28px 30px}
.feat h3{font-size:23px;color:var(--ink);margin-bottom:8px}
.feat p{color:var(--mut)}
/* prices */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
.pr{background:#fff;border-radius:24px;padding:32px 28px;box-shadow:0 10px 30px rgba(14,22,48,.06);display:flex;flex-direction:column;border:2px solid transparent;position:relative}
.pr.pop{border-color:var(--gold);transform:translateY(-8px)}
.pr .pl{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2b1d07;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;white-space:nowrap}
.pr h3{font-size:24px;color:var(--ink)}
.pr .pz{font-family:Georgia,serif;font-size:46px;color:var(--ink);margin:10px 0}
.pr p{color:var(--mut);flex:1;margin-bottom:22px}
.note{text-align:center;color:var(--mut);margin-top:26px;font-size:14.5px}
/* order */
.order{background:linear-gradient(180deg,var(--ink) 0,#1b2752 100%);color:#efe8da}
.form{max-width:860px;margin:0 auto;background:var(--cream);color:var(--txt);border-radius:28px;padding:34px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.tabs div{flex:1;min-width:120px;text-align:center;padding:10px 6px;border-radius:14px;background:#efe5d2;color:var(--mut);font-size:14px;font-weight:600}
.tabs div.on{background:var(--ink);color:var(--gold2)}
.tabs div.ok{background:#e6d6b0;color:var(--ink)}
.pane{display:none}.pane.on{display:block;animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pick label{cursor:pointer;border-radius:16px;overflow:hidden;background:#fff;border:2px solid transparent;transition:.2s;display:block;text-align:center}
.pick label img{aspect-ratio:1;object-fit:cover;width:100%}
.pick label span{display:block;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.pick input{display:none}
.pick input:checked+label{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,184,100,.35)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips input{display:none}
.chips label{cursor:pointer;padding:12px 18px;border-radius:30px;background:#fff;border:2px solid #e8dcc4;font-weight:600;color:var(--ink);font-size:15px}
.chips label.rec{border-color:#d9c08a}
.chips input:checked+label{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fl{margin-bottom:18px}
.fl>span{display:block;font-weight:600;font-size:14px;margin-bottom:7px;color:var(--ink)}
.fl small{display:block;color:var(--mut);font-size:12.5px;margin-top:5px}
input[type=text],input[type=email],input[type=number],textarea,.form select{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid #e2d5bb;background:#fff;font-size:15px;font-family:inherit;color:var(--txt)}
textarea{min-height:90px;resize:vertical}
.bad{border-color:#c4473a!important;box-shadow:0 0 0 3px rgba(196,71,58,.15)}
.up{display:flex;align-items:center;gap:16px}
.up .pv{width:84px;height:84px;border-radius:50%;background:#efe5d2;overflow:hidden;flex:none;border:3px solid var(--gold)}
.up .pv img{width:100%;height:100%;object-fit:cover}
.up label.btn{cursor:pointer}
.up input{display:none}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk input{display:none}
.pk label{cursor:pointer;background:#fff;border:2px solid #e8dcc4;border-radius:16px;padding:14px;text-align:center}
.pk label b{display:block;color:var(--ink);font-size:15px}
.pk label em{font-style:normal;font-family:Georgia,serif;font-size:24px;color:var(--ink)}
.pk input:checked+label{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,184,100,.35)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;margin:10px 0}
.ck input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--ink)}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;flex-wrap:wrap}
.sum{font-family:Georgia,serif;font-size:26px;color:var(--ink)}
.sum small{font-family:inherit;font-size:14px;color:var(--mut);display:block}
.msg{color:#c4473a;font-size:14px;min-height:20px;margin-top:8px}
.done{text-align:center;padding:10px 0}
.done h3{font-size:30px;color:var(--ink);margin:10px 0}
.done .no{font-family:ui-monospace,monospace;font-size:20px;background:#fff;border:1.5px dashed var(--gold);display:inline-block;padding:8px 18px;border-radius:12px;margin:10px 0 16px}
.done p{color:var(--mut);max-width:520px;margin:0 auto 18px}
.bank{background:#fff;border-radius:14px;padding:16px;text-align:start;max-width:440px;margin:0 auto 16px;font-size:14px;line-height:1.8}
/* faq */
.faq{max-width:780px;margin:0 auto}
details{background:#fff;border-radius:18px;margin-bottom:12px;padding:20px 24px;box-shadow:0 6px 18px rgba(14,22,48,.05)}
summary{cursor:pointer;font-weight:650;font-size:17px;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
summary:after{content:"+";color:var(--gold);font-size:22px;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--mut);margin-top:10px}
footer{background:var(--ink);color:#9d96a8;padding:40px 0;text-align:center;font-size:14px}
footer .logo{justify-content:center;margin-bottom:10px}
.ex{max-width:960px;margin:0 auto}
.extabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.extabs button{border:1.5px solid rgba(226,184,100,.4);background:transparent;color:#efe8da;border-radius:30px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.extabs button.on{background:var(--gold);color:#2b1d07;border-color:var(--gold)}
.player{position:relative;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.45);aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block;object-fit:cover}
.player .soon{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;background:linear-gradient(180deg,transparent 50%,rgba(14,22,48,.85));pointer-events:none}
.player .soon span{background:rgba(14,22,48,.8);color:var(--gold2);border:1px solid rgba(226,184,100,.5);border-radius:30px;padding:8px 18px;font-size:14px}
/* snow */
.snow{position:absolute;inset:0;z-index:1;pointer-events:none}
.rv{opacity:0;transform:translateY(24px);transition:.8s}.rv.in{opacity:1;transform:none}
[dir=rtl] .pr .pl{left:auto;right:50%;transform:translateX(50%)}
html[lang=ar] body *,html[lang=he] body *{letter-spacing:0!important}
@media(max-width:860px){.hero{min-height:auto;display:block}.hero img{height:auto!important;bottom:auto!important;object-fit:contain;animation:none}.hero .wrap{padding-top:86vw;padding-bottom:50px}.hero:after{background:linear-gradient(180deg,rgba(10,16,38,.35) 0%,transparent 15%,transparent 40%,rgba(10,16,38,.4) 60%,rgba(10,16,38,.6) 100%)!important}.hero{background:#0a1430}nav .links{display:none}.steps,.prices,.inside{grid-template-columns:1fr}.pr.pop{transform:none}.row{grid-template-columns:1fr}.pk{grid-template-columns:1fr}.form{padding:22px 18px;border-radius:22px}section{padding:70px 0}.strip img{height:200px}.tabs div{min-width:70px;font-size:12px}nav .btn.sm{display:none}}
</style>
</head>
<body>
<nav id="nav"><div class="wrap">
 <a class="logo" href="#top"><svg viewBox="0 0 40 40"><rect x="3" y="9" width="34" height="23" rx="3" fill="#E2B864"/><path d="M3 11l17 12 17-12" fill="none" stroke="#9a6a1c" stroke-width="2"/><circle cx="20" cy="23" r="6.5" fill="#8E1F2C"/><path d="M20 18.5l1.3 2.9 3.1.3-2.4 2 .8 3-2.8-1.6-2.8 1.6.8-3-2.4-2 3.1-.3z" fill="#F4D79A"/></svg>WonderGram</a>
 <div class="links"><a href="#how" data-i="nav_how"></a><a href="#heroes" data-i="nav_heroes"></a><a href="#prices" data-i="nav_prices"></a><a href="#faq" data-i="nav_faq"></a></div>
 <select class="lang" id="langsel" aria-label="Language"></select>
 <a class="btn sm" href="#order" data-i="cta"></a>
</div></nav>

<header class="hero" id="top">
 <picture><source media="(max-width:860px)" srcset="img/hero_m.jpg"><img src="img/cast.jpg" alt=""></picture>
 <canvas class="snow" id="snow"></canvas>
 <div class="wrap">
  <div class="copy">
  <div class="wm"><svg viewBox="0 0 24 24"><path d="M12 1.5l2.6 6.9 7.4.4-5.8 4.6 2 7.1L12 16.4l-6.2 4.1 2-7.1L2 8.8l7.4-.4z" fill="#F4D79A"/></svg>WonderGram</div>
  <div class="eb" data-i="hero_eb"></div>
  <h1 data-i="hero_h"></h1>
  <p class="lead" data-i="hero_p"></p>
  <a class="btn" href="#order" data-i="cta"></a>
  <div class="badges"><span data-i="b1"></span><span data-i="b2"></span><span data-i="b3"></span><span data-i="b4"></span></div>
  </div>
 </div>
</header>

<section id="how"><div class="wrap">
 <div class="sh rv"><h2 data-i="nav_how"></h2></div>
 <div class="steps">
  <div class="step rv"><b>1</b><h3 data-i="s1_t"></h3><p data-i="s1_p"></p></div>
  <div class="step rv"><b>2</b><h3 data-i="s2_t"></h3><p data-i="s2_p"></p></div>
  <div class="step rv"><b>3</b><h3 data-i="s3_t"></h3><p data-i="s3_p"></p></div>
 </div>
</div></section>

<section class="dark" id="heroes"><div class="wrap">
 <div class="sh rv"><h2 data-i="heroes_t"></h2><p data-i="heroes_p"></p></div>
 <div class="cards" id="cards"></div>
</div>
<div class="strip">
 <img src="img/santa_full.jpg" alt=""><img src="img/moroz_full.jpg" alt=""><img src="img/nicholas_full.jpg" alt=""><img src="img/fairy_full.jpg" alt=""><img src="img/wizard_full.jpg" alt=""><img src="img/elves.jpg" alt="">
</div>
</section>

<section class="dark" id="examples" style="padding-top:20px"><div class="wrap">
 <div class="sh rv"><h2 data-i="ex_t"></h2><p data-i="ex_p"></p></div>
 <div class="ex"><div class="extabs" id="exTabs"></div>
  <div class="player"><video id="exv" controls playsinline preload="metadata"></video><div class="soon" id="exSoon"><span data-i="ex_soon"></span></div></div></div>
</div></section>

<section id="inside"><div class="wrap">
 <div class="sh rv"><h2 data-i="inside_t"></h2></div>
 <div class="inside">
  <div class="feat rv"><div class="im"><img src="img/book.jpg" alt=""><div class="ph" id="bookph"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="#c9a35a"/><path d="M3.5 22c.8-5 4.3-7.5 8.5-7.5s7.7 2.5 8.5 7.5z" fill="#c9a35a"/></svg></div><div class="nm" id="booknm">Sophie</div></div>
   <div class="tx"><h3 data-i="book_t"></h3><p data-i="book_p"></p></div></div>
  <div class="feat rv"><div class="im"><img src="img/santa.jpg" alt=""></div>
   <div class="tx"><h3 data-i="globe_t"></h3><p data-i="globe_p"></p></div></div>
  <div class="feat rv"><div class="im"><img src="img/gift.jpg" alt=""></div>
   <div class="tx"><h3 data-i="gift_t"></h3><p data-i="gift_p"></p></div></div>
 </div>
</div></section>

<section id="prices" style="background:#f4ead6"><div class="wrap">
 <div class="sh rv"><h2 data-i="prices_t"></h2></div>
 <div class="prices">
  <div class="pr rv"><h3 data-i="p1_n"></h3><div class="pz">$19</div><p data-i="p1_d"></p><a class="btn ghost" href="#order" data-pk="p1" data-i="choose"></a></div>
  <div class="pr pop rv"><div class="pl" data-i="popular"></div><h3 data-i="p2_n"></h3><div class="pz">$29</div><p data-i="p2_d"></p><a class="btn" href="#order" data-pk="p2" data-i="choose"></a></div>
  <div class="pr rv"><h3 data-i="p3_n"></h3><div class="pz">$39</div><p data-i="p3_d"></p><a class="btn ghost" href="#order" data-pk="p3" data-i="choose"></a></div>
 </div>
 <p class="note"><span data-i="express"></span>: +$9</p>
</div></section>

<section class="order" id="order"><div class="wrap">
 <div class="sh rv"><h2 style="color:#fff" data-i="order_t"></h2></div>
 <form class="form" id="form" novalidate>
  <div class="tabs" id="tabs"><div data-i="st1"></div><div data-i="st2"></div><div data-i="st3"></div><div data-i="st4"></div></div>

  <div class="pane on" data-p="0"><div class="pick" id="pickHero"></div></div>

  <div class="pane" data-p="1"><div class="chips" id="pickOcc"></div></div>

  <div class="pane" data-p="2">
   <div class="row">
    <label class="fl"><span data-i="f_name"></span><input type="text" id="cname" data-ph="f_name_ph" maxlength="40"></label>
    <div class="row" style="gap:12px">
     <label class="fl"><span data-i="f_age"></span><input type="number" id="cage" min="1" max="14"></label>
     <label class="fl"><span data-i="f_gender"></span><select id="cgen"><option value="boy" data-i="g_boy"></option><option value="girl" data-i="g_girl"></option></select></label>
    </div>
   </div>
   <div class="fl"><span data-i="f_photo"></span>
    <div class="up"><div class="pv" id="pv"></div><label class="btn ghost sm"><input type="file" id="cphoto" accept="image/*" multiple><span data-i="f_upload"></span></label></div>
    <small data-i="f_photo_h"></small></div>
   <label class="fl"><span data-i="f_ach"></span><textarea id="cach" data-ph="f_ach_ph" maxlength="600"></textarea></label>
   <label class="fl"><span data-i="f_hobby"></span><input type="text" id="chobby" data-ph="f_hobby_ph" maxlength="150"></label>
   <label class="fl"><span data-i="f_wish"></span><input type="text" id="cwish" data-ph="f_wish_ph" maxlength="200"></label>
   <label class="fl"><span data-i="f_gift"></span><input type="text" id="cgift" data-ph="f_gift_ph" maxlength="200"></label>
  </div>

  <div class="pane" data-p="3">
   <div class="fl"><div class="pk" id="pickPk"></div></div>
   <label class="ck"><input type="checkbox" id="exp"><span><span data-i="express"></span> (+$9)</span></label>
   <div class="row">
    <label class="fl"><span data-i="f_lang"></span><select id="vlang"></select></label>
    <label class="fl"><span data-i="f_email"></span><input type="email" id="email" placeholder="name@mail.com"></label>
   </div>
   <div class="fl"><span data-i="f_pay"></span><div class="chips">
    <input type="radio" name="pay" id="pcard" value="card" checked><label for="pcard"> <span data-i="pay_card"></span></label>
    <input type="radio" name="pay" id="pbank" value="bank"><label for="pbank"> <span data-i="pay_bank"></span></label></div></div>
   <label class="ck"><input type="checkbox" id="consent"><span data-i="f_consent"></span></label>
  </div>

  <div class="pane" data-p="4"><div class="done" id="done"></div></div>

  <div class="nav2" id="nav2">
   <button type="button" class="btn ghost" id="bk" data-i="back"></button>
   <div class="sum" id="sum"></div>
   <button type="button" class="btn" id="nx" data-i="next"></button>
  </div>
  <div class="msg" id="msg"></div>
 </form>
</div></section>

<section id="faq"><div class="wrap">
 <div class="sh rv"><h2 data-i="nav_faq"></h2></div>
 <div class="faq">
  <details><summary data-i="q1"></summary><p data-i="a1"></p></details>
  <details><summary data-i="q2"></summary><p data-i="a2"></p></details>
  <details><summary data-i="q3"></summary><p data-i="a3"></p></details>
  <details><summary data-i="q4"></summary><p data-i="a4"></p></details>
 </div>
</div></section>

<footer><div class="wrap"><div class="logo" style="display:flex">WonderGram</div><div data-i="hero_eb"></div><div style="margin-top:8px;opacity:.6">© 2026</div></div></footer>

<script src="i18n.js"></script>
<script>
/* ===== Settings: fill before launch ===== */
const PAY_URL = "";            // payment page link (WayForPay / Stripe Payment Link), order number is appended
const BANK = {name:"—", iban:"—", bank:"—"};
const PRICES = {p1:19, p2:29, p3:39, exp:9};

const HEROES=[
 {id:"santa",img:"santa",occ:["christmas","newyear","birthday"]},
 {id:"moroz",img:"moroz",occ:["newyear","birthday"]},
 {id:"nicholas",img:"nicholas",occ:["nicholas"]},
 {id:"fairy",img:"fairy",occ:["tooth"]},
 {id:"wizard",img:"wizard",occ:["birthday"]},
 {id:"gnomes",img:"gnomes",occ:["birthday","newyear","christmas"]},
 {id:"bunny",img:"bunny",occ:["easter"]}];
const OCC=["newyear","christmas","nicholas","birthday","tooth","easter","other"];
const codes=LANGS.map(l=>l[0]);
let L="ru";
const t=k=>(D[k]||[])[codes.indexOf(L)]||(D[k]||[])[2]||k;
const $=s=>document.querySelector(s);

function applyLang(l){
 L=codes.includes(l)?l:"en";
 try{localStorage.setItem("wg_lang",L)}catch(e){}
 document.documentElement.lang=L;
 document.documentElement.dir=(L=="ar"||L=="he")?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $("#langsel").value=L;
 renderCards();renderEx();loadEx();renderPick();renderOcc();renderPk();updSum();
 if(!$("#vlang").dataset.touched)$("#vlang").value=L;
}
/* language select */
$("#langsel").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
$("#vlang").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
$("#vlang").onchange=e=>e.target.dataset.touched=1;
$("#langsel").onchange=e=>applyLang(e.target.value);

/* state */
const S={hero:"",occ:"",pk:"p2",step:0,photo:""};

function renderCards(){
 $("#cards").innerHTML=HEROES.map(h=>`<div class="card rv in" data-h="${h.id}"><div class="im"><img src="img/${h.img}.jpg" alt="" loading="lazy"></div><div class="tx"><h3>${t("h_"+h.id)}</h3><p>${t("d_"+h.id)}</p><div class="tags">${h.occ.map(o=>`<i>${t("occ_"+o)}</i>`).join("")}</div><span class="btn sm">${t("choose")}</span></div></div>`).join("");
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{S.hero=c.dataset.h;S.occ=HEROES.find(h=>h.id==S.hero).occ[0];renderPick();renderOcc();go(1);$("#order").scrollIntoView()});
}
function renderPick(){
 $("#pickHero").innerHTML=HEROES.map(h=>`<input type="radio" name="hero" id="hr_${h.id}" value="${h.id}" ${S.hero==h.id?"checked":""}><label for="hr_${h.id}"><img src="img/${h.img}.jpg" alt=""><span>${t("h_"+h.id)}</span></label>`).join("");
 document.querySelectorAll("[name=hero]").forEach(r=>r.onchange=()=>{S.hero=r.value;S.occ=HEROES.find(h=>h.id==S.hero).occ[0];renderOcc();go(1)});
}
function renderOcc(){
 const rec=S.hero?HEROES.find(h=>h.id==S.hero).occ:[];
 $("#pickOcc").innerHTML=OCC.map(o=>`<input type="radio" name="occ" id="oc_${o}" value="${o}" ${S.occ==o?"checked":""}><label for="oc_${o}" class="${rec.includes(o)?"rec":""}">${rec.includes(o)?"★ ":""}${t("occ_"+o)}</label>`).join("");
 document.querySelectorAll("[name=occ]").forEach(r=>r.onchange=()=>{S.occ=r.value;updSum()});
}
function renderPk(){
 $("#pickPk").innerHTML=["p1","p2","p3"].map(p=>`<input type="radio" name="pk" id="pk_${p}" value="${p}" ${S.pk==p?"checked":""}><label for="pk_${p}"><b>${t(p+"_n")}</b><em>$${PRICES[p]}</em></label>`).join("");
 document.querySelectorAll("[name=pk]").forEach(r=>r.onchange=()=>{S.pk=r.value;updSum()});
}
document.querySelectorAll("[data-pk]").forEach(a=>a.onclick=()=>{S.pk=a.dataset.pk;renderPk();updSum()});
$("#exp").onchange=updSum;
function total(){return PRICES[S.pk]+($("#exp").checked?PRICES.exp:0)}
function updSum(){$("#sum").innerHTML=`<small>${t("total")}</small>$${total()}`}

/* photo */
$("#cphoto").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=r.result;$("#pv").innerHTML=`<img src="${r.result}">`;$("#bookph").innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(f)};
$("#cname").oninput=e=>{$("#booknm").textContent=e.target.value||"Sophie"};

/* steps */
function go(n){
 S.step=n;
 document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",+p.dataset.p==n));
 document.querySelectorAll("#tabs div").forEach((d,i)=>{d.className=i==n?"on":i<n?"ok":""});
 $("#bk").style.visibility=n==0?"hidden":"visible";
 $("#nx").textContent=t(n==3?"submit":"next");$("#nx").dataset.i=n==3?"submit":"next";
 $("#nav2").style.display=n==4?"none":"flex";
 $("#msg").textContent="";
}
function valid(n){
 let bad=[];
 if(n==0&&!S.hero)bad.push("#pickHero");
 if(n==1&&!S.occ)bad.push("#pickOcc");
 if(n==2){if(!$("#cname").value.trim())bad.push("#cname");if(!$("#cage").value)bad.push("#cage");if(!$("#cach").value.trim())bad.push("#cach")}
 if(n==3){if(!/^\S+@\S+\.\S+$/.test($("#email").value))bad.push("#email");if(!$("#consent").checked)bad.push("#consent")}
 document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
 bad.forEach(s=>$(s).classList.add("bad"));
 $("#msg").textContent=bad.length?t("err"):"";
 return !bad.length;
}
$("#nx").onclick=()=>{if(!valid(S.step))return;if(S.step<3)go(S.step+1);else finish()};
$("#bk").onclick=()=>go(Math.max(0,S.step-1));
document.querySelectorAll("#tabs div").forEach((d,i)=>d.onclick=()=>{if(i<S.step)go(i)});

function finish(){
 const id="WG-"+Date.now().toString(36).toUpperCase().slice(-6);
 const pay=document.querySelector("[name=pay]:checked").value;
 const o={id,hero:S.hero,occasion:S.occ,name:$("#cname").value.trim(),age:$("#cage").value,gender:$("#cgen").value,achievements:$("#cach").value.trim(),hobby:$("#chobby").value.trim(),wish:$("#cwish").value.trim(),gift:$("#cgift").value.trim(),videoLang:$("#vlang").value,package:S.pk,express:$("#exp").checked,email:$("#email").value,pay,total:total(),siteLang:L,created:new Date().toISOString()};
 try{localStorage.setItem("wg_order_"+id,JSON.stringify(o))}catch(e){}
 let h=`<div style="font-size:44px">✦</div><h3>${t("done_t")}</h3><div>${t("order_no")}</div><div class="no">${id}</div><div class="sum" style="margin-bottom:14px">$${o.total}</div>`;
 if(pay=="card"){h+=`<p>${t("done_card")}</p><a class="btn" ${PAY_URL?`href="${PAY_URL}${encodeURIComponent(id)}" target="_blank"`:`href="#order"`}> ${t("pay_btn")}</a>`}
 else{h+=`<p>${t("done_bank")}</p><div class="bank">${BANK.name}<br>IBAN: <b>${BANK.iban}</b><br>${BANK.bank}<br>${t("order_no")}: <b>${id}</b></div>`}
 $("#done").innerHTML=h;go(4);
}

/* nav, reveal, snow */
addEventListener("scroll",()=>$("#nav").classList.toggle("sc",scrollY>40));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
(function(){const c=$("#snow"),x=c.getContext("2d");let W,H,f=[];function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}rs();addEventListener("resize",rs);
for(let i=0;i<90;i++)f.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.25,d:Math.random()*6});
(function lp(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.75)";f.forEach(p=>{p.y+=p.s;p.x+=Math.sin((p.y+p.d*40)/60)*.3;if(p.y>H){p.y=-4;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(lp)})()})();

/* examples: video/{hero}_{lang}.mp4, fallback to English */
let EX="santa";
function renderEx(){
 $("#exTabs").innerHTML=HEROES.map(h=>`<button type="button" class="${h.id==EX?"on":""}" data-x="${h.id}">${t("h_"+h.id)}</button>`).join("");
 document.querySelectorAll("#exTabs button").forEach(b=>b.onclick=()=>{EX=b.dataset.x;renderEx();loadEx()});
}
function loadEx(){
 const v=$("#exv"),h=HEROES.find(x=>x.id==EX),src=[...new Set([`video/${EX}_${L}.mp4`,`video/${EX}_en.mp4`,`video/${EX}_uk.mp4`])];let i=0;
 $("#exSoon").style.display="flex";v.poster=`img/${h.img}.jpg`;
 v.onloadeddata=()=>{$("#exSoon").style.display="none"};
 v.onerror=()=>{i++;if(i<src.length){v.src=src[i]}else{v.removeAttribute("src")}};
 v.src=src[0];
}
/* init */
let saved="";try{saved=localStorage.getItem("wg_lang")||""}catch(e){}
const nav=(navigator.language||"en").slice(0,2).toLowerCase();
applyLang(saved||(codes.includes(nav)?nav:"en"));
go(0);
</script>
</body>
</html>
